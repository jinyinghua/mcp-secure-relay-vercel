name: Build relay-agent

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'
  pull_request:
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Linux ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Test agent
        working-directory: agent
        run: go test ./...

      - name: Build static binary
        working-directory: agent
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../dist/package
          go build -trimpath -ldflags='-s -w' -o ../dist/package/relay-agent .
          cp relay-agent.example.json ../dist/package/relay-agent.example.json
          cp ../README.zh-CN.md ../dist/package/README.zh-CN.md
          cp ../README.md ../dist/package/README.md
          tar -C ../dist/package -czf ../dist/mcp-secure-relay-agent_linux_${{ matrix.goarch }}.tar.gz .
          sha256sum ../dist/mcp-secure-relay-agent_linux_${{ matrix.goarch }}.tar.gz > ../dist/mcp-secure-relay-agent_linux_${{ matrix.goarch }}.tar.gz.sha256

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-secure-relay-agent_linux_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: mcp-secure-relay-agent_*
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
